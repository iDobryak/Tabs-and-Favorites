<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Tab Duplicate Cleaner</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Открытые ссылки</h1>

    <section class="settings">
      <label>
        <input type="checkbox" id="includeQueryParams" checked />
        Учитывать query-параметры
      </label>

      <label>
        <input type="checkbox" id="includeHash" />
        Учитывать hash-атрибуты
      </label>

      <label>
        <input type="checkbox" id="ignoreTrailingSlash" checked />
        Считать /page и /page/ одинаковыми
      </label>

      <label>
        <input type="checkbox" id="protectPinnedTabs" checked />
        Не закрывать и не переносить закреплённые вкладки
      </label>

      <label>
        <input type="checkbox" id="showOnlyDuplicateSites" />
        Показывать только сайты с дублями
      </label>

      <label>
        <input type="checkbox" id="allowGroupedDuplicateRemoval" />
        Удалять дубликаты внутри групп вкладок
      </label>
    </section>

    <section class="actions">
      <button id="rescanButton">Обновить список</button>
      <button id="closeAllDuplicatesButton" class="danger">
        Удалить все дубликаты
      </button>
      <button id="sortCurrentWindowButton">Отсортировать текущее окно</button>
      <button id="sortAllWindowsButton">Отсортировать все окна</button>
      <div class="action-with-input">
        <button id="groupSitesToWindowsButton">Разнести сайты по окнам</button>
        <label class="inline-number-field" for="tabsPerWindowLimit">
          <span>Вкладок в окне</span>
          <input
            id="tabsPerWindowLimit"
            type="number"
            min="1"
            step="1"
            value="20"
          />
        </label>
      </div>
    </section>

    <div id="status"></div>
    <main id="sites"></main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
