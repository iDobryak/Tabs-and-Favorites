<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tab Duplicate Cleaner & Sorter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="page-header">
      <h1 id="appTitle">Open Tabs</h1>
      <label class="toolbar-language-field" for="uiLanguage">
        <span id="settingsLanguageLabel"></span>
        <select id="uiLanguage"></select>
      </label>
    </header>

    <section class="settings">
      <label>
        <input type="checkbox" id="includeQueryParams" checked />
        <span id="includeQueryParamsLabel"></span>
      </label>

      <label>
        <input type="checkbox" id="includeHash" />
        <span id="includeHashLabel"></span>
      </label>

      <label>
        <input type="checkbox" id="ignoreTrailingSlash" checked />
        <span id="ignoreTrailingSlashLabel"></span>
      </label>

      <label>
        <input type="checkbox" id="protectPinnedTabs" checked />
        <span id="protectPinnedTabsLabel"></span>
      </label>

      <label>
        <input type="checkbox" id="showOnlyDuplicateSites" />
        <span id="showOnlyDuplicateSitesLabel"></span>
      </label>

      <label>
        <input type="checkbox" id="allowGroupedDuplicateRemoval" />
        <span id="allowGroupedDuplicateRemovalLabel"></span>
      </label>
    </section>

    <section class="actions">
      <button id="rescanButton"></button>
      <button id="closeAllDuplicatesButton" class="danger"></button>
      <button id="sortCurrentWindowButton"></button>
      <button id="sortAllWindowsButton"></button>
      <div class="action-with-input">
        <button id="groupSitesToWindowsButton"></button>
        <label class="inline-number-field" for="tabsPerWindowLimit">
          <span id="tabsPerWindowLimitLabel"></span>
          <input
            id="tabsPerWindowLimit"
            type="number"
            min="1"
            step="1"
            value="20"
          />
        </label>
      </div>
    </section>

    <div id="status"></div>
    <main id="sites"></main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
